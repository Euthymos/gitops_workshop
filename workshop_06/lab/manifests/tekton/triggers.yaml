# TriggerBinding – mapuje payload Gitea webhook na parametre TriggerTemplate
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: gitea-push-binding
  namespace: workshop-06-cicd
spec:
  params:
    - name: repo_full_name
      value: $(body.repository.full_name)
    - name: ref
      value: $(body.ref)
    - name: sha
      value: $(body.after)

---
# TriggerTemplate – šablóna pre PipelineRun spustený webhookom
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: gitea-push-template
  namespace: workshop-06-cicd
spec:
  params:
    - name: repo_full_name
    - name: ref
    - name: sha
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: greeter-ci-
        namespace: workshop-06-cicd
      spec:
        serviceAccountName: pipeline
        pipelineRef:
          name: greeter-ci
        params:
          - name: appRepoFullName
            value: $(tt.params.repo_full_name)
          - name: appRevision
            value: main
          - name: imageRepo
            value: image-registry.openshift-image-registry.svc:5000/workshop-06-cicd/greeter
          - name: imageTag
            value: $(tt.params.sha)
          - name: infraRepoFullName
            value: gitea-admin/gitops-infra
          - name: infraValuesPath
            value: greeter/values.yaml
        workspaces:
          - name: shared
            persistentVolumeClaim:
              claimName: cicd-workspace
          - name: basic-auth
            secret:
              secretName: gitea-credentials

---
# EventListener – naslúcha webhookom z Gitea, filtruje push na main branch
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: greeter-listener
  namespace: workshop-06-cicd
spec:
  serviceAccountName: el-sa
  triggers:
    - name: on-push-main
      interceptors:
        - ref:
            name: cel
          params:
            - name: filter
              # Spusti pipeline len pri pushe na main branch
              value: "body.ref == 'refs/heads/main'"
      bindings:
        - ref: gitea-push-binding
      template:
        ref: gitea-push-template
