# ServiceAccount pre pipeline runy (ak pipeline SA neexistuje – OCP Pipelines ho vytvorí automaticky)
# Táto RBAC dáva pipeline SA právo spúšťať PipelineRuns a pristupovať k Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-runner
  namespace: workshop-06-cicd
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "taskruns"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "persistentvolumeclaims", "secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-runner-binding
  namespace: workshop-06-cicd
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: workshop-06-cicd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-runner
